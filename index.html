<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WCC Viral AI Agent</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: white;
      padding: 20px;
      margin: 0;
    }

    .container {
      max-width: 700px;
      margin: auto;
    }

    h1 {
      text-align: center;
      color: #38bdf8;
    }

    input, textarea, button {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      border-radius: 8px;
      border: none;
      box-sizing: border-box;
    }

    input, textarea {
      background: #1e293b;
      color: white;
    }

    textarea {
      height: 120px;
    }

    button {
      background: #2563eb;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    .card {
      background: #1e293b;
      padding: 15px;
      margin-top: 20px;
      border-radius: 10px;
      display: none;
    }

    .title {
      color: #38bdf8;
      font-weight: bold;
      margin-bottom: 5px;
    }

    .content {
      white-space: pre-wrap;
      background: #0f172a;
      padding: 10px;
      border-radius: 5px;
    }
  </style>
</head>
<body>

<div class="container">

<h1>🚀 WCC Viral AI Agent</h1>

<input
id="apiKey"
type="password"
placeholder="Enter Gemini API Key">

<textarea
id="topic"
placeholder="Enter Topic (Example: Donald Trump)">
</textarea>

<button onclick="generateViralContent()">
Generate Viral Content ✨
</button>

<div class="card" id="resultCard">

<div class="title">🔥 Viral Title</div>
<div class="content" id="outTitle"></div>

<br>

<div class="title">✍️ English Caption</div>
<div class="content" id="outCaption"></div>

<br>

<div class="title">🇱🇰 Sinhala Translation</div>
<div class="content" id="outSinhala"></div>

<br>

<div class="title">#️⃣ Hashtags</div>
<div class="content" id="outHashtags"></div>

<br>

<div class="title">🖼️ Image Prompt</div>
<div class="content" id="outPrompt"></div>

<br>

<div class="title">📌 Pinned Comment</div>
<div class="content" id="outComment"></div>

<br>

<div class="title">📊 Viral Score</div>
<div class="content" id="outScore"></div>

</div>

</div>

<script>

async function generateViralContent() {

const apiKey =
document.getElementById("apiKey").value;

const topic =
document.getElementById("topic").value;

if(!apiKey){
alert("Enter Gemini API Key");
return;
}

if(!topic){
alert("Enter Topic");
return;
}

const prompt = `
You are an expert viral Facebook creator.

Generate:

1. Viral Title
2. English Caption
3. Sinhala Translation
4. Viral Hashtags
5. AI Image Prompt
6. Pinned Comment
7. Viral Score

Topic: ${topic}

Return ONLY JSON.
`;

try{

const response = await fetch(
`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`,
{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
contents:[
{
parts:[
{
text:prompt
}
]
}
]
})
}
);

const data = await response.json();

const text =
data.candidates[0].content.parts[0].text;

document.getElementById(
"outTitle"
).innerText=text;

document.getElementById(
"outCaption"
).innerText=text;

document.getElementById(
"outSinhala"
).innerText=text;

document.getElementById(
"outHashtags"
).innerText=text;

document.getElementById(
"outPrompt"
).innerText=text;

document.getElementById(
"outComment"
).innerText=text;

document.getElementById(
"outScore"
).innerText=text;

document.getElementById(
"resultCard"
).style.display="block";

}catch(error){

alert(error);

}

}

</script>

</body>
</html>
